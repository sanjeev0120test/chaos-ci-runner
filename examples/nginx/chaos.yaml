# Sample chaos.yaml exercised by the self-test workflow.
#
# Demonstrates v1 + v2 features:
#   - Two Chaos Mesh experiments (PodChaos pod-kill + NetworkChaos delay)
#   - HTTP probes against the target NodePort (v1)
#   - Prometheus probe via in-cluster kube-state-metrics (v2)
#
# Adoption pattern: copy this file into your repo, point `target.manifest`
# at your manifest, adjust selectors, then call the reusable workflow.
cluster:
  port_mappings:
    - "30080:30080@server:0"

observability:
  prometheus: true

target:
  manifest: ./examples/nginx/manifest.yaml
  namespace: default
  ready_timeout_s: 180

steady_state:
  http_probes:
    - name: nginx-root
      url: http://localhost:30080/
      success_rate_pct: 80
      latency_p99_ms: 1500
      duration_s: 10
      interval_ms: 250

  prometheus_probes:
    # During chaos, at least 2 of the 3 nginx pods must remain Ready.
    # kube-state-metrics exposes kube_pod_status_ready with condition=true.
    - name: nginx-pods-ready
      query: >
        sum(kube_pod_status_ready{namespace="default",
        pod=~"nginx-.*", condition="true"})
      min: 2
      success_rate_pct: 70
      duration_s: 20
      interval_ms: 2000

experiments:
  - name: pod-kill-one
    engine: chaos-mesh
    duration_s: 20
    kind: PodChaos
    spec:
      action: pod-kill
      mode: one
      selector:
        namespaces:
          - default
        labelSelectors:
          app: nginx

  - name: network-delay-200ms
    engine: chaos-mesh
    duration_s: 30
    kind: NetworkChaos
    spec:
      action: delay
      mode: all
      selector:
        namespaces:
          - default
        labelSelectors:
          app: nginx
      delay:
        latency: "200ms"
        correlation: "0"
        jitter: "10ms"

gate:
  min_pass_rate_pct: 100
  fail_on_probe_breach: true
