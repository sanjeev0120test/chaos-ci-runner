# Sample chaos.yaml used by the self-test workflow.
# Exercises both Chaos Mesh (PodChaos: pod-kill, kills via k8s API) and
# LitmusChaos (pod-delete, also kills via k8s API). Both are
# infrastructure-light so they run reliably on a single-node k3d cluster.
cluster:
  port_mappings:
    - "30080:30080@server:0"

target:
  manifest: ./examples/nginx/manifest.yaml
  namespace: default
  ready_timeout_s: 180

steady_state:
  http_probes:
    - name: nginx-root
      url: http://localhost:30080/
      success_rate_pct: 80
      latency_p99_ms: 1500
      duration_s: 10
      interval_ms: 250

experiments:
  - name: pod-kill-one
    engine: chaos-mesh
    duration_s: 20
    kind: PodChaos
    spec:
      action: pod-kill
      mode: one
      selector:
        namespaces:
          - default
        labelSelectors:
          app: nginx

  - name: pod-delete-litmus
    engine: litmus
    experiment: pod-delete
    duration_s: 30
    app_label: app=nginx
    params:
      APP_NAMESPACE: default
      CHAOS_INTERVAL: "10"
      FORCE: "true"

gate:
  min_pass_rate_pct: 100
  fail_on_probe_breach: true
