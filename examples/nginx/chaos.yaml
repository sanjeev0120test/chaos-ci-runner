# Sample chaos.yaml exercised by the self-test workflow.
#
# Two Chaos Mesh experiments to keep v1 dependency-light and reliable:
#   - PodChaos pod-kill (one-shot, validates pod recovery)
#   - NetworkChaos delay (continuous, validates latency tolerance)
#
# The LitmusChaos engine ships in chaos-ci-runner but currently expects
# the litmus-operator CRDs to be pre-installed; a first-class Litmus
# integration is on the v2 roadmap (docs/roadmap.md).
cluster:
  port_mappings:
    - "30080:30080@server:0"

target:
  manifest: ./examples/nginx/manifest.yaml
  namespace: default
  ready_timeout_s: 180

steady_state:
  http_probes:
    - name: nginx-root
      url: http://localhost:30080/
      success_rate_pct: 80
      latency_p99_ms: 1500
      duration_s: 10
      interval_ms: 250

experiments:
  - name: pod-kill-one
    engine: chaos-mesh
    duration_s: 20
    kind: PodChaos
    spec:
      action: pod-kill
      mode: one
      selector:
        namespaces:
          - default
        labelSelectors:
          app: nginx

  - name: network-delay-200ms
    engine: chaos-mesh
    duration_s: 30
    kind: NetworkChaos
    spec:
      action: delay
      mode: all
      selector:
        namespaces:
          - default
        labelSelectors:
          app: nginx
      delay:
        latency: "200ms"
        correlation: "0"
        jitter: "10ms"

gate:
  min_pass_rate_pct: 100
  fail_on_probe_breach: true
