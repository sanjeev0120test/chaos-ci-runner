# CI exercise of the nginx sample. The published chaos.yaml keeps the full
# Prometheus windows and the longer experiment holds. This file is what the
# self-test runs, so the cluster job stays inside two minutes.
cluster:
  port_mappings:
    - "30080:30080@server:0"

observability:
  prometheus: false

target:
  manifest: ./examples/nginx/manifest.yaml
  namespace: default
  ready_timeout_s: 60

steady_state:
  hypothesis: >
    Killing one nginx pod and adding 200ms of delay leaves the service
    reachable.

  http_probes:
    - name: nginx-root
      url: http://localhost:30080/
      success_rate_pct: 80
      latency_p99_ms: 1500
      duration_s: 5
      interval_ms: 250

experiments:
  - name: pod-kill-one
    engine: chaos-mesh
    duration_s: 8
    kind: PodChaos
    spec:
      action: pod-kill
      mode: one
      selector:
        namespaces:
          - default
        labelSelectors:
          app: nginx

  - name: network-delay-200ms
    engine: chaos-mesh
    duration_s: 8
    kind: NetworkChaos
    spec:
      action: delay
      mode: all
      selector:
        namespaces:
          - default
        labelSelectors:
          app: nginx
      delay:
        latency: "200ms"
        correlation: "0"
        jitter: "10ms"

gate:
  tier: standard
  min_pass_rate_pct: 100
  fail_on_probe_breach: true
  require_steady_state_return: true
