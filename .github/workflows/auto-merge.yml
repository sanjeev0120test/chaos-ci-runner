name: auto-merge

# Dependabot pull requests were staying open because nothing enabled
# auto-merge, and `gh pr merge --auto` errors once the required check is
# already green. This job merges a non-draft pull request after `ci` succeeds.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,isDraft,headRefOid \
            --jq ".[] | select(.headRefOid==\"$SHA\" and .isDraft==false) | .number" | head -n 1)
          if [ -z "$number" ]; then
            echo "no open pull request for $SHA"
            exit 0
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
