name: auto-merge

# Merges every open pull request into the default branch as soon as GitHub
# can apply it. Reviews, failing checks, and major Dependabot bumps do not
# hold the pull request. This job never checks out pull request code.

on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Merge open pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY:?}"

          log() { printf '%s\n' "$*"; }

          merge_one() {
            local number="$1"
            if gh pr merge "$number" --repo "$repo" --squash --delete-branch; then
              log "squash-merged #${number}"
              return 0
            fi
            if gh pr merge "$number" --repo "$repo" --merge --delete-branch; then
              log "merged #${number}"
              return 0
            fi
            log "could not merge #${number} on this attempt"
            return 1
          }

          rebase_if_dependabot() {
            local number="$1"
            local author="$2"
            if [[ "$author" != "dependabot[bot]" && "$author" != "app/dependabot" ]]; then
              gh api --method PUT "repos/${repo}/pulls/${number}/update-branch" >/dev/null 2>&1 || true
              log "refresh #${number}: branch is conflicting or behind"
              return 0
            fi
            local last
            last="$(gh pr view "$number" --repo "$repo" --json comments --jq '.comments[-1].body // empty' 2>/dev/null || true)"
            if [[ "$last" == *"@dependabot rebase"* ]]; then
              log "wait #${number}: Dependabot rebase already requested"
              return 0
            fi
            gh pr comment "$number" --repo "$repo" --body "@dependabot rebase" >/dev/null
            log "asked Dependabot to rebase #${number}"
          }

          process() {
            local number="$1"
            local json state draft mergeable status author tries
            tries=0
            while (( tries < 6 )); do
              tries=$((tries + 1))
              json="$(gh pr view "$number" --repo "$repo" --json state,isDraft,mergeable,mergeStateStatus,author,title)"
              state="$(jq -r '.state' <<<"$json")"
              if [[ "$state" != "OPEN" ]]; then
                log "skip #${number}: ${state}"
                return 0
              fi
              draft="$(jq -r '.isDraft' <<<"$json")"
              mergeable="$(jq -r '.mergeable' <<<"$json")"
              status="$(jq -r '.mergeStateStatus' <<<"$json")"
              author="$(jq -r '.author.login // empty' <<<"$json")"
              log "consider #${number}: mergeable=${mergeable} status=${status} try=${tries}"
              if [[ "$draft" == "true" ]]; then
                gh pr ready "$number" --repo "$repo" >/dev/null 2>&1 || true
              fi
              if [[ "$mergeable" == "UNKNOWN" || "$status" == "UNKNOWN" ]]; then
                sleep 8
                continue
              fi
              if [[ "$status" == "DIRTY" || "$mergeable" == "CONFLICTING" ]]; then
                rebase_if_dependabot "$number" "$author"
                return 0
              fi
              if [[ "$status" == "BEHIND" ]]; then
                gh api --method PUT "repos/${repo}/pulls/${number}/update-branch" >/dev/null 2>&1 || true
                sleep 5
                continue
              fi
              merge_one "$number" || true
              return 0
            done
            log "wait #${number}: mergeability stayed unknown"
          }

          numbers="$(gh pr list --repo "$repo" --state open --limit 100 --json number --jq '.[].number')"
          if [[ -z "${numbers}" ]]; then
            log "no open pull requests"
            exit 0
          fi
          while IFS= read -r number; do
            [[ -z "$number" ]] && continue
            process "$number"
          done <<<"$numbers"
