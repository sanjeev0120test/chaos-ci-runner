name: self-test

# Full cluster pipeline. It is not a merge requirement: the pull-request
# gate is the `ci` workflow, which stays on the order of a minute.
# This job runs when the runner, the sample, or the cluster workflow changes,
# and on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "chaos_ci_runner/**"
      - "examples/**"
      - "Dockerfile"
      - ".github/workflows/self-test.yml"
      - ".github/workflows/chaos-reusable.yml"
      - ".github/actions/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: end-to-end against examples/nginx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install chaos-ci-runner
        run: uv pip install -e .

      - name: Install kubectl, helm, and k3d
        uses: ./.github/actions/setup-cluster-tools

      - name: Doctor (preflight)
        run: uv run chaos-ci-runner doctor

      - name: Run chaos pipeline
        run: |
          uv run chaos-ci-runner run \
            --config examples/nginx/chaos.yaml \
            --report-dir reports \
            --verbose

      - name: Fetch previous successful run as baseline (best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p baseline
          PREV_RUN=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow self-test \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$PREV_RUN" ] && [ "$PREV_RUN" != "null" ]; then
            echo "fetching baseline from run $PREV_RUN"
            gh run download "$PREV_RUN" \
              --repo "${{ github.repository }}" \
              --name chaos-report \
              --dir baseline || echo "no baseline available (first run on main?)"
          else
            echo "no previous successful self-test on main yet; skipping baseline"
          fi
          ls -la baseline/ || true

      - name: Resilience regression check
        if: success()
        run: |
          if [ -f baseline/report.json ]; then
            uv run chaos-ci-runner regression \
              --current reports/report.json \
              --baseline baseline/report.json \
              --config examples/nginx/chaos.yaml
          else
            echo "baseline missing; skipping regression check (acceptable on first run)"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: reports/
