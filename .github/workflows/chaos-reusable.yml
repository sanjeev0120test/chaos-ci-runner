name: chaos-ci-runner (reusable)

# Reusable workflow consumers call from their own repo:
#
#   jobs:
#     chaos:
#       uses: sanjeev0120test/chaos-ci-runner/.github/workflows/chaos-reusable.yml@main
#       with:
#         config: ./chaos.yaml
#
# It checks out the caller's repo, installs k3d/helm/kubectl/chaos-ci-runner,
# runs the pipeline, and uploads the report as an artifact.

on:
  workflow_call:
    inputs:
      config:
        description: "Path to chaos.yaml in the caller repository"
        required: true
        type: string
      chaos_ci_runner_ref:
        description: "Git ref of chaos-ci-runner to install"
        required: false
        default: "main"
        type: string
      report_dir:
        description: "Where to write reports/"
        required: false
        default: "reports"
        type: string
      runner_os:
        description: "GitHub runner image"
        required: false
        default: "ubuntu-latest"
        type: string
      comment_on_pr:
        description: "When true and run is on a pull request, post the report as a PR comment."
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  chaos:
    name: chaos pipeline
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 20
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install chaos-ci-runner
        run: uv pip install "git+https://github.com/sanjeev0120test/chaos-ci-runner.git@${{ inputs.chaos_ci_runner_ref }}"

      - name: Install kubectl, helm, and k3d
        uses: sanjeev0120test/chaos-ci-runner/.github/actions/setup-cluster-tools@${{ inputs.chaos_ci_runner_ref }}

      - name: Doctor (preflight)
        run: uv run chaos-ci-runner doctor

      - name: Run chaos pipeline
        run: |
          uv run chaos-ci-runner run \
            --config "${{ inputs.config }}" \
            --report-dir "${{ inputs.report_dir }}" \
            --verbose

      - name: Fetch previous successful run as baseline
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p baseline
          PREV_RUN=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --branch "${{ github.event.repository.default_branch }}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$PREV_RUN" ] && [ "$PREV_RUN" != "null" ]; then
            echo "fetching baseline from run $PREV_RUN"
            gh run download "$PREV_RUN" \
              --repo "${{ github.repository }}" \
              --name chaos-report \
              --dir baseline || echo "no baseline artifact on that run"
          else
            echo "no previous successful run; skipping baseline"
          fi

      - name: Resilience regression check
        if: success()
        run: |
          if [ -f baseline/report.json ]; then
            uv run chaos-ci-runner regression \
              --current "${{ inputs.report_dir }}/report.json" \
              --baseline baseline/report.json \
              --config "${{ inputs.config }}"
          else
            echo "baseline missing; skipping regression check"
          fi

      - name: Comment report on PR
        if: always() && inputs.comment_on_pr && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- chaos-ci-runner-report -->';
            const md = path.join('${{ inputs.report_dir }}', 'report.md');
            if (!fs.existsSync(md)) { core.info('no report.md, skipping'); return; }
            const body = marker + '\n' + fs.readFileSync(md, 'utf8') +
              `\n\n_posted by chaos-ci-runner on \`${context.sha.substring(0,7)}\`_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-report
          path: ${{ inputs.report_dir }}/
