name: chaos-ci-runner (reusable)

# Reusable workflow consumers call from their own repo:
#
#   jobs:
#     chaos:
#       uses: sanjeev0120test/chaos-ci-runner/.github/workflows/chaos-reusable.yml@main
#       with:
#         config: ./chaos.yaml
#
# It checks out the caller's repo, installs k3d/helm/kubectl/chaos-ci-runner,
# runs the pipeline, and uploads the report as an artifact.

on:
  workflow_call:
    inputs:
      config:
        description: "Path to chaos.yaml in the caller repository"
        required: true
        type: string
      chaos_ci_runner_ref:
        description: "Git ref of chaos-ci-runner to install"
        required: false
        default: "main"
        type: string
      report_dir:
        description: "Where to write reports/"
        required: false
        default: "reports"
        type: string
      runner_os:
        description: "GitHub runner image"
        required: false
        default: "ubuntu-latest"
        type: string
      comment_on_pr:
        description: "When true and run is on a pull request, post the report as a PR comment."
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  chaos:
    name: chaos pipeline
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 30
    env:
      KUBECTL_VERSION: v1.30.4
      HELM_VERSION: v3.15.4
      K3D_VERSION: v5.7.4
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chaos-ci-runner
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/sanjeev0120test/chaos-ci-runner.git@${{ inputs.chaos_ci_runner_ref }}"

      - name: Install kubectl
        run: |
          curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl

      - name: Install helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version ${HELM_VERSION}

      - name: Install k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${K3D_VERSION} bash

      - name: Doctor (preflight)
        run: chaos-ci-runner doctor

      - name: Run chaos pipeline
        run: |
          chaos-ci-runner run \
            --config "${{ inputs.config }}" \
            --report-dir "${{ inputs.report_dir }}" \
            --verbose

      - name: Comment report on PR
        if: always() && inputs.comment_on_pr && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const md = path.join('${{ inputs.report_dir }}', 'report.md');
            if (!fs.existsSync(md)) { core.info('no report.md, skipping'); return; }
            const body = fs.readFileSync(md, 'utf8') +
              `\n\n_posted by chaos-ci-runner on \`${context.sha.substring(0,7)}\`_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: ${{ inputs.report_dir }}/
