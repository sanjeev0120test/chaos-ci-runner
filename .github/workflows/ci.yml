name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check chaos_ci_runner tests

      - name: Ruff format check
        run: ruff format --check chaos_ci_runner tests

      - name: Pytest
        run: pytest -q

      - name: CLI smoke
        run: |
          chaos-ci-runner version
          chaos-ci-runner validate --config examples/nginx/chaos.yaml
