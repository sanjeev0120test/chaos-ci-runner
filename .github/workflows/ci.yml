name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install package + dev deps
        run: |
          uv venv --clear
          uv pip install -e ".[dev]"

      - name: Ruff check
        run: uv run ruff check chaos_ci_runner tests

      - name: Ruff format check
        run: uv run ruff format --check chaos_ci_runner tests

      - name: Pytest
        run: uv run pytest -q

      - name: CLI smoke
        run: |
          uv run chaos-ci-runner version
          uv run chaos-ci-runner validate --config examples/nginx/chaos.yaml
