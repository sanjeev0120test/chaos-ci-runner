name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install package + dev deps
        run: uv pip install -e ".[dev]"

      - name: Ruff check
        run: uv run ruff check chaos_ci_runner tests

      - name: Ruff format check
        run: uv run ruff format --check chaos_ci_runner tests

      - name: Pytest
        run: uv run pytest -q

      - name: CLI smoke
        run: |
          uv run chaos-ci-runner version
          uv run chaos-ci-runner validate --config examples/nginx/chaos.yaml
